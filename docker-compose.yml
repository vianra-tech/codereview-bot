version: '3.8'

# =============================================================================
# CodeReview.ai - Complete Production Docker Compose
# Single atomic deployment for all services with persistent volumes
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # INFRASTRUCTURE LAYER (Data Persistence Critical)
  # ---------------------------------------------------------------------------
  
  nats:
    image: nats:2.10-alpine
    container_name: codereview-nats
    command: ["-js", "-m", "8222", "-sd", "/data/jetstream"]
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring / JetStream API
    volumes:
      - nats_data:/data
      - nats_config:/etc/nats
    healthcheck:
      test: ["CMD", "nats", "server", "check", "jetstream"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped
    networks:
      - codereview-network

  redis:
    image: redis:7-alpine
    container_name: codereview-redis
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1 --loglevel notice
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped
    networks:
      - codereview-network

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: codereview-clickhouse
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # Native interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: codereview
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    restart: unless-stopped
    networks:
      - codereview-network

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: codereview-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: https://minio.${DOMAIN:-localhost}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: unless-stopped
    networks:
      - codereview-network

  # ---------------------------------------------------------------------------
  # APPLICATION LAYER (Stateless Workers)
  # ---------------------------------------------------------------------------

  ingress-svc:
    build:
      context: .
      dockerfile: services/ingress-svc/Dockerfile
    container_name: codereview-ingress
    ports:
      - "8080:8080"
    environment:
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PORT=8080
      - ENVIRONMENT=production
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped
    networks:
      - codereview-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  analysis-svc:
    build:
      context: .
      dockerfile: services/analysis-svc/Dockerfile
    container_name: codereview-analysis
    environment:
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
      - NVIDIA_NIM_URL=${NVIDIA_NIM_URL}
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY}
      - NVIDIA_NIM_MODEL=${NVIDIA_NIM_MODEL:-meta/llama-3.1-70b-instruct}
      - WORK_DIR=/tmp/codereview
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - analysis_workdir:/tmp/codereview
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 2G
          cpus: '1'
    restart: unless-stopped
    networks:
      - codereview-network
    # Analysis service is a worker - no port exposed externally

  aggregation-svc:
    build:
      context: .
      dockerfile: services/aggregation-svc/Dockerfile
    container_name: codereview-aggregation
    environment:
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped
    networks:
      - codereview-network

  integration-svc:
    build:
      context: .
      dockerfile: services/integration-svc/Dockerfile
    container_name: codereview-integration
    environment:
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    restart: unless-stopped
    networks:
      - codereview-network

  admin-svc:
    build:
      context: .
      dockerfile: services/admin-svc/Dockerfile
    container_name: codereview-admin
    ports:
      - "8081:8081"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - NATS_URL=nats://nats:4222
      - REDIS_URL=redis://redis:6379
      - CLICKHOUSE_URL=http://clickhouse:8123
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PORT=8081
      - ENVIRONMENT=production
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 512M
          cpus: '0.5'
    restart: unless-stopped
    networks:
      - codereview-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: codereview-dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://api.${DOMAIN:-localhost}
      - NEXTAUTH_URL=https://app.${DOMAIN:-localhost}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - ADMIN_API_URL=http://admin-svc:8081
      - NODE_ENV=production
    depends_on:
      admin-svc:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 2G
          cpus: '1'
    restart: unless-stopped
    networks:
      - codereview-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # ONE-SHOT MIGRATION JOB
  # ---------------------------------------------------------------------------
  
  migrate:
    image: migrate/migrate:v4.20.1
    container_name: codereview-migrate
    command: 
      - -path
      - /migrations
      - -database
      - "${SUPABASE_DB_URL}"
      - up
    volumes:
      - ./services/admin-svc/migrations:/migrations
    depends_on:
      - admin-svc
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 3
    networks:
      - codereview-network
    # This is a one-shot job, not a long-running service

# ---------------------------------------------------------------------------
# PERSISTENT VOLUMES (Data survives restarts, updates, container recreation)
# ---------------------------------------------------------------------------

volumes:
  # NATS JetStream data (streams, consumers, messages)
  nats_data:
    driver: local
    name: codereview_nats_data
  
  nats_config:
    driver: local
    name: codereview_nats_config

  # Redis persistence (AOF + RDB)
  redis_data:
    driver: local
    name: codereview_redis_data

  # ClickHouse analytical data
  clickhouse_data:
    driver: local
    name: codereview_clickhouse_data

  clickhouse_logs:
    driver: local
    name: codereview_clickhouse_logs

  # MinIO S3 object storage (SARIF artifacts, uploads)
  minio_data:
    driver: local
    name: codereview_minio_data

  # Analysis workspace (git clones, temp files)
  analysis_workdir:
    driver: local
    name: codereview_analysis_workdir

# ---------------------------------------------------------------------------
# NETWORK (Isolated internal network)
# ---------------------------------------------------------------------------

networks:
  codereview-network:
    driver: bridge
    name: codereview-network
    attachable: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.28.0.0/16